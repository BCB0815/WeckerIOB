package de.christian.weckersync

import org.w3c.dom.Document
import org.w3c.dom.Element
import org.xml.sax.InputSource
import java.io.StringReader
import javax.xml.parsers.DocumentBuilderFactory

/** Pure JVM protocol code, also exercised by local unit tests. */
object SonosXml {
    const val SERVICE = "urn:schemas-upnp-org:service:AlarmClock:1"
    val fields = listOf("ID", "StartTime", "Duration", "Recurrence", "Enabled", "RoomUUID", "ProgramURI", "ProgramMetaData", "PlayMode", "Volume", "IncludeLinkedZones")
    fun parse(xml: String): Document {
        // Android's parser does not implement every JAXP feature. Reject DTD/entity declarations
        // explicitly, then disable external entities where supported and reject resolver use.
        require(!Regex("<!\\s*(DOCTYPE|ENTITY)", RegexOption.IGNORE_CASE).containsMatchIn(xml)) { "XML mit DTD/Entitäten wird abgelehnt." }
        val factory = DocumentBuilderFactory.newInstance().apply {
            isNamespaceAware = true
            isExpandEntityReferences = false
        }
        for (feature in listOf("http://xml.org/sax/features/external-general-entities", "http://xml.org/sax/features/external-parameter-entities", "http://apache.org/xml/features/nonvalidating/load-external-dtd")) {
            runCatching { factory.setFeature(feature, false) }
        }
        return factory.newDocumentBuilder().apply {
            setEntityResolver { _, _ -> throw org.xml.sax.SAXException("External entity rejected") }
        }.parse(InputSource(StringReader(xml)))
    }
    fun elements(doc: Document, name: String): List<Element> {
        val list = doc.getElementsByTagNameNS("*", name)
        return (0 until list.length).map { list.item(it) as Element }
    }
    fun text(doc: Document, name: String): String? = elements(doc, name).firstOrNull()?.textContent
    fun escape(s: String): String = s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;").replace("'", "&apos;")
    fun envelope(action: String, args: Map<String, String> = emptyMap()): String {
        require(action in listOf("ListAlarms", "UpdateAlarm"))
        val content = args.entries.joinToString("") { (key, value) ->
            require(key in fields)
            "<$key>${escape(value)}</$key>"
        }
        return """<?xml version="1.0" encoding="utf-8"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/"><s:Body><u:$action xmlns:u="$SERVICE">$content</u:$action></s:Body></s:Envelope>"""
    }
    fun checkSoap(doc: Document, action: String) {
        if (elements(doc, "Fault").isNotEmpty()) {
            val code = text(doc, "errorCode")?.filter { it.isDigit() }?.take(8).orEmpty()
            throw ApiException("Sonos SOAP-Fehler $code. Alarm-ID und Geräteunterstützung prüfen.")
        }
        if (elements(doc, "${action}Response").isEmpty()) throw ApiException("Sonos-Antwort für $action fehlt.")
    }
    fun alarms(doc: Document): List<Map<String, String>> {
        checkSoap(doc, "ListAlarms")
        val nested = text(doc, "CurrentAlarmList") ?: throw ApiException("Sonos-Alarmliste fehlt.")
        return elements(parse(nested), "Alarm").map { element ->
            fields.associateWith { field ->
                if (!element.hasAttribute(field)) throw ApiException("Sonos-Alarm unvollständig ($field). Keine Änderung vorgenommen.")
                element.getAttribute(field)
            }
        }
    }
    fun updateArgs(alarm: Map<String, String>, target: Boolean): Map<String, String> = fields.associateWith {
        if (it == "Enabled") { if (target) "1" else "0" }
        else alarm[it] ?: throw ApiException("Sonos-Alarm unvollständig ($it).")
    }
    fun enabled(alarm: Map<String, String>): Boolean = when (alarm["Enabled"]) {
        "1", "true" -> true
        "0", "false" -> false
        else -> throw ApiException("Sonos Enabled-Status ungültig.")
    }
}
